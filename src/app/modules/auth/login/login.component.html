<div class="mt-5">
    <form #form="ngForm">
        <span class="w-full mb-5 input-container w-full md:w-30rem mb-5">
<!--            <i class="pi pi-user icon-left"></i>-->
            <i class="pi pi-times icon-right" (click)="username = null"></i>
            <input id="username1" type="text"
                   [(ngModel)]="username"
                   name="username"
                   #usernameRef="ngModel"
                   required
                   placeholder="{{'MAIN.AUTH.USER_NAME' | translate}}" pInputText class="w-full mb-5" style="padding-left:1.0rem">
        </span>
        <br>
        <span class="w-full mb-5 input-container w-full md:w-30rem mb-5">
<!--            <i class="pi pi-key icon-left"></i>-->
            <i class="icon-right" *ngIf="!showPassword" (click)="showPassword = !showPassword"> <img src="/assets/layout/images/icons/eye.svg"></i>
            <i class="icon-right" *ngIf="showPassword" (click)="showPassword = !showPassword"> <img src="/assets/layout/images/icons/eye-slash.svg"></i>
            <input id="password" type="{{showPassword? 'text' : 'password'}}"
                   [(ngModel)]="password"
                   name="password"
                   #passwordRef="ngModel"
                   required
                   placeholder="{{'MAIN.AUTH.PASSWORD' | translate}}" pInputText class="w-full mb-5" style="padding-left:1.0rem">
        </span>

        <div class="flex align-items-center justify-content-between mb-5 gap-5">
            <div class="flex align-items-center">
                <p-checkbox [(ngModel)]="confirmed" id="rememberme" name="confirmed" [binary]="true" styleClass="mr-2"></p-checkbox>
                <label for="rememberme">{{'COMMON.ENTRY_AGREEMENT' | translate}}</label>
            </div>
            <p-dialog header="{{'COMMON.USER_AGREEMENT' | translate}}" [(visible)]="display" [modal]="true" showEffect="fade" [style]="{width: '30rem'}" [breakpoints]="{'960px': '25rem'}">
                <p class="line-height-3 m-0">
                    {{'COMMON.USER_AGREEMENT_TEXT' | translate}}
                </p>
                <ng-template pTemplate="footer">
                    <button pButton icon="pi pi-check" (click)="display=false; confirmed=true;" label="{{'COMMON.ENTRY_AGREEMENT' | translate}}" class="p-button-outlined"></button>
                </ng-template>
            </p-dialog>
            <a class="font-medium no-underline ml-2 text-right cursor-pointer"
               (click)="display=true"
               style="color: #CC400C">{{'COMMON.USER_AGREEMENT' | translate}}</a>
        </div>
        <button pButton pRipple label="{{'MAIN.AUTH.LOGON' | translate}}"
                [disabled]="form.invalid || !confirmed"
                class="w-full p-3 text-xl" (click)="login()"></button>
    </form>
    <app-custom-toast></app-custom-toast>
</div>
