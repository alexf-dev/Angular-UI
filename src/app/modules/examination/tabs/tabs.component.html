<div class="steps-container">
  <div class="steps-header">
    <div class="steps-row">
      <div
        *ngFor="let tab of activeTabs; let i = index"
        class="step-item"
        [class.active]="activeTab === i + 1"
        (click)="activeTab = tab.id"
      >
        <span class="step-number">Шаг {{ i + 1 }}</span>
        <span class="step-title">{{ tab.label }}</span>
      </div>
    </div>
  </div>

  <div class="steps-content">
    <app-reg-data
      *ngIf="activeTab === 1"
      [patientId]="patientId"
      [expertOpinionId]="expertOpinionId"
      (next)="goNext()"
    ></app-reg-data>

    <app-social-data
      *ngIf="activeTab === 2"
      [patientId]="patientId"
      (next)="goNext()"
      (prev)="goPrev()"
    ></app-social-data>

    <app-examination-data
      *ngIf="activeTab === 3"
      [patientId]="patientId"
      (next)="goNext()"
      (prev)="goPrev()"
    ></app-examination-data>

    <app-add-guardian
      *ngIf="activeTab === 4"
      [patientId]="patientId"
      (next)="goNext()"
      (prev)="goPrev()"
    ></app-add-guardian>

    <app-documents
      *ngIf="activeTab === 5"
      [patientId]="patientId"
      [mainId]="mainId"
    ></app-documents>

    <app-absentee-history
      *ngIf="activeTab === 6"
      [expertOpinionId]="expertOpinionId"
    ></app-absentee-history>

    <app-expert-conclusion
      *ngIf="activeTab === 7"
      class="tab-panel"
    ></app-expert-conclusion>

    <app-formation-ipr
      *ngIf="activeTab === 8"
      [expertOpinionId]="expertOpinionId"
      [patientId]="patientId"
      (prev)="goPrev()"
    ></app-formation-ipr>
  </div>
</div>
