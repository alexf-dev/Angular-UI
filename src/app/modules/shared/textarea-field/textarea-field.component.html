<div class="input-field-row" [class.input-field-row--stacked]="stacked">
  <label class="row-label" [attr.for]="inputId">{{ labelKey | translate }}</label>
  <textarea
    [id]="inputId"
    pInputTextarea
    [rows]="rows"
    [ngModel]="value"
    (ngModelChange)="onValue($event)"
    [placeholder]="placeholderKey | translate"
  ></textarea>
</div>
