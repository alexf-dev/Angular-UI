<app-collapsible-block [titleKey]="translationPrefix + 'SPECIALIST_DATA.TITLE'" [isExpanded]="isExpanded">
  <app-text-input-field
    [labelKey]="translationPrefix + 'SPECIALIST_DATA.SPECIALIST'"
    [(value)]="model.specialist"
    [stacked]="true">
  </app-text-input-field>

  <app-textarea-field
    [(value)]="model.additionalInfo"
    [stacked]="true">
  </app-textarea-field>
</app-collapsible-block>
