<div class="laboratory-block">

  <!-- Заголовок -->
  <div class="block-header" (click)="toggle()">
    <i class="pi pi-chevron-down"
       [class.rotated]="isExpanded"
       style="margin-right: 8px; font-size: 12px; color: #262626;">
    </i>
    <span class="block-title">
      {{ 'MAIN.EXAMINATION.EXPERT_EXAMINATION.LABORATORY_DATA.BLOOD_TEST' | translate }}
    </span>
  </div>

  <!-- Содержимое -->
  <div class="block-content" *ngIf="isExpanded">
    <form [formGroup]="form" class="fields-container">

      <!-- Чекбокс "В пределах нормы" -->
      <div class="checkbox-row">
        <p-checkbox
          inputId="bloodTestNormal"
          [(ngModel)]="isBloodTestNormal"
          (ngModelChange)="onBloodTestNormalChange($event)"
          [binary]="true">
        </p-checkbox>
        <label for="bloodTestNormal" class="checkbox-label">
          {{ 'MAIN.EXAMINATION.EXPERT_EXAMINATION.LABORATORY_DATA.IN_NORMAL_RANGE' | translate }}
        </label>
      </div>

      <!-- Сетка полей 2 колонки -->
      <div class="fields-grid">
        <div class="field-group" *ngFor="let field of bloodFields"
             [class.full-width]="field.fullWidth">
          <label [attr.for]="field.key" class="field-label">
            {{ field.labelKey | translate }}
          </label>
          <input
            [attr.id]="field.key"
            type="text"
            [formControlName]="field.key"
            pInputText
            [placeholder]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.LABORATORY_DATA.ENTER_VALUE' | translate"
            class="w-full"
          />
          <small class="field-hint">
            {{ field.hintKey | translate }}
          </small>
        </div>
      </div>

      <!-- История анализа крови -->
      <div class="field-group full-width">
        <textarea
          formControlName="history"
          pInputTextarea
          [autoResize]="true"
          [rows]="2"
          class="w-full history-textarea"
        ></textarea>
      </div>

    </form>
  </div>

</div>
