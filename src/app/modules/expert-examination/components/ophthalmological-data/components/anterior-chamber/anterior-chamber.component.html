<app-collapsible-block

  <app-check-comment-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.IRREGULAR'"
    [(checked)]="model.irregular.checked"
    [(comment)]="model.irregular.value">

    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.REGULAR'"

    [(comment)]="model.regular.value">

  <app-check-comment-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.MEDIUM_DEPTH'"
    [(checked)]="model.mediumDepth.checked"
    [(comment)]="model.mediumDepth.value">

  <app-check-comment-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.DEEP'"

    [(comment)]="model.deep.value">

    [(checked)]="model.shallow.checked"
    [(comment)]="model.shallow.value">
  </app-check-comment-field>

  <app-check-comment-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.ABSENT'"
    [(checked)]="model.absent.checked"
    [(comment)]="model.absent.value">
  </app-check-comment-field>

  <app-check-comment-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.CONTENTS_TRANSPARENT'"

    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.CONTENTS_CLOUDY'"

    [(comment)]="model.contentsCloudy.value">

    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.HYPOPYON'"

    [(comment)]="model.hypopyon.value">

    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.HYPHEMA'"
    [(checked)]="model.hyphema.checked"
    [(comment)]="model.hyphema.value">
  </app-check-comment-field>

  <app-textarea-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.ANTERIOR_CHAMBER.ADDITIONAL_INFO'"
    [(value)]="model.additionalInfo"
    [stacked]="true">
  </app-textarea-field>

</app-collapsible-block>
