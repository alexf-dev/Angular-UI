<app-collapsible-block
  [titleKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.TITLE'"
  [isExpanded]="isExpanded">

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.ORIENTATES_FREELY'"
    [(checked)]="model.orientatesFreely">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.DOES_NOT_ORIENTATE'"
    [(checked)]="model.doesNotOrientate">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.WALKS_WITH_HELP'"
    [(checked)]="model.walksWithHelp">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.WALKS_WITH_CANE'"
    [(checked)]="model.walksWithCane">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.WALKS_INDEPENDENTLY'"
    [(checked)]="model.walksIndependently">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.OVERCOMES_OBSTACLES_FREELY'"
    [(checked)]="model.overcomesObstaclesFreely">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.OVERCOMES_OBSTACLES_WITH_DIFFICULTY'"
    [(checked)]="model.overcomesObstaclesWithDifficulty">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.FINDS_DOOR_HANDLE_CHAIR'"
    [(checked)]="model.findsDoorHandleChair">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.DRESSES_INDEPENDENTLY'"
    [(checked)]="model.dressesIndependently">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.DRESSES_WITH_HELP'"
    [(checked)]="model.dressesWithHelp">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.OPHTHALMOLOGY_DATA.PATIENT_BEHAVIOR.FOLLOWS_HAND_MOVEMENT'"
    [(checked)]="model.followsHandMovement">
  </app-check-field>

</app-collapsible-block>
