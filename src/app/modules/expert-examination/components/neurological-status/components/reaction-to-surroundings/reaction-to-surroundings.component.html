<app-collapsible-block
  [titleKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.REACTION_TO_SURROUNDINGS.TITLE'"
  [isExpanded]="isExpanded">

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.REACTION_TO_SURROUNDINGS.ADEQUATE'"
    [(checked)]="model.adequate">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.REACTION_TO_SURROUNDINGS.INADEQUATE'"
    [(checked)]="model.inadequate">
  </app-check-field>

  <app-textarea-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.REACTION_TO_SURROUNDINGS.COMMENT'"
    [(value)]="model.comment"
    [stacked]="true">
  </app-textarea-field>

</app-collapsible-block>
