<app-collapsible-block
  [titleKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.SPECIALIST_DATA.TITLE'"
  [isExpanded]="isExpanded">

  <app-text-input-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.SPECIALIST_DATA.SPECIALIST'"
    [(value)]="model.specialist"
    [stacked]="true">
  </app-text-input-field>

  <app-textarea-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.SPECIALIST_DATA.CONCLUSION'"
    [(value)]="model.conclusion"
    [stacked]="true">
  </app-textarea-field>

</app-collapsible-block>
