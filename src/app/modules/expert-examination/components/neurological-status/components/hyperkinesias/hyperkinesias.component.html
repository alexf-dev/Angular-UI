<app-collapsible-block
  [titleKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.TITLE'"
  [isExpanded]="isExpanded">

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.ATHETOSIS'"
    [(checked)]="model.athetosis">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.CHOREIC_CONVULSIONS'"
    [(checked)]="model.choreicConvulsions">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.TICS'"
    [(checked)]="model.tics">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.MYOCLONIA'"
    [(checked)]="model.myoclonia">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.HEMIBALLISMUS'"
    [(checked)]="model.hemiballismus">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.TREMOR'"
    [(checked)]="model.tremor">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.TORSION_SPASM'"
    [(checked)]="model.torsionSpasm">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.BLEPHAROSPASM'"
    [(checked)]="model.blepharospasm">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.FACIAL_HEMISPASM'"
    [(checked)]="model.facialHemispasm">
  </app-check-field>

  <app-textarea-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.HYPERKINESIAS.ADDITIONAL_INFO'"
    [(value)]="model.additionalInfo"
    [stacked]="true">
  </app-textarea-field>

</app-collapsible-block>
