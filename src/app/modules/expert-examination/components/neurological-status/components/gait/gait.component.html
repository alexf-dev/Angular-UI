<app-collapsible-block
  [titleKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.TITLE'"
  [isExpanded]="isExpanded">

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.SPARING'"
    [(checked)]="model.sparing">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.PARETIC'"
    [(checked)]="model.paretic">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.STEPPAGE'"
    [(checked)]="model.steppage">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.HEMIPARETIC'"
    [(checked)]="model.hemiparetic">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.SPASTIC_PARETIC'"
    [(checked)]="model.spasticParetic">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.ATACTIC'"
    [(checked)]="model.atactic">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.DUCK'"
    [(checked)]="model.duck">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.SLOW_SMALL_STEPS'"
    [(checked)]="model.slowSmallSteps">
  </app-check-field>

  <app-textarea-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.GAIT.ADDITIONAL_INFO'"
    [(value)]="model.additionalInfo"
    [stacked]="true">
  </app-textarea-field>

</app-collapsible-block>
