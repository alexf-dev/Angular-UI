<div class="ears-section">

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.DYSRAPHIC_STATUS.EARS.CHECKED'"
    [(checked)]="model.checked">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.DYSRAPHIC_STATUS.EARS.LARGE_PROTRUDING'"
    [(checked)]="model.largeProtruding">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.DYSRAPHIC_STATUS.EARS.SMALL_DEFORMED'"
    [(checked)]="model.smallDeformed">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.DYSRAPHIC_STATUS.EARS.DIFFERENT_SIZES'"
    [(checked)]="model.differentSizes">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.DYSRAPHIC_STATUS.EARS.DIFFERENTLY_POSITIONED'"
    [(checked)]="model.differentlyPositioned">
  </app-check-field>

  <app-check-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.DYSRAPHIC_STATUS.EARS.LOW_POSITIONED'"
    [(checked)]="model.lowPositioned">
  </app-check-field>

  <app-textarea-field
    [labelKey]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.NEUROLOGICAL_STATUS.DYSRAPHIC_STATUS.EARS.COMMENT'"
    [(value)]="model.comment"
    [stacked]="true">
  </app-textarea-field>

</div>
