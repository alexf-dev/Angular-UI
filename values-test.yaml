Deployment:
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: "200m"
      memory: 200Mi
  livereadProbeType:
    httpGet:
      enabled: false

environment:
  - name: _JAVA_OPTIONS
    value: "-XX:MaxRAMPercentage=80.0"
  - name: TZ
    value: "Asia/Almaty"
    
Service:
  type: ClusterIP
  port: 80

ConfigMap:
  enabled: false
  name: cbdi-config

Secret:
  enabled: false
  name: cbdi-secret

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
